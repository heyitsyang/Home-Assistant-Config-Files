##  Note: leading spaces in each line are critical
##  to yaml interpretation - do not delete them

### SENSORS  ###

#
# Filters are considered a type of sensor
#

- platform: statistics
  name: "7 Day Avg Soil Temperature"
  entity_id: sensor.soil_probe_ds18s20_temperature # probe reports every hour
  state_characteristic: average_linear
  sampling_size: 168 # 7 days = 168 hours
  precision: 1

- platform: statistics
  name: "24hr Avg Water Pressure"
  entity_id: sensor.water_pressure
  state_characteristic: mean
  sampling_size: 1440 # allow for reporting every minute for 24 hours
  max_age:
    hours: 24
  precision: 2

- platform: statistics
  name: "24hr Max Water Pressure"
  entity_id: sensor.water_pressure
  state_characteristic: value_max
  max_age:
    hours: 24

- platform: statistics
  name: "24hr Min Water Pressure"
  entity_id: sensor.water_pressure
  state_characteristic: value_min
  max_age:
    hours: 24

# - platform: statistics
#   name: "10m Avg Master Bedroom Temperature"
#   entity_id: sensor.espresense_masterbdrm_ds18b20_temperature
#   state_characteristic: mean
#   sampling_size: 600 # default state value is the running average of this many samples
#   precision: 2 # number of decimal places

#
# RECORDER LOAD REDUCTION - system_monitor/opnsense sensors update every 10-70s and never
# repeat a value, so recording them raw was the majority of the DB size. These "_average_internal"
# statistics sensors maintain a rolling 5-min average but are themselves excluded from recorder
# (see recorder.yaml). A trigger-based template sensor in templates.yaml samples each one every
# 5 minutes and that sampled sensor is what actually gets recorded - 288 rows/day instead of
# thousands, while still reflecting the average of that 5-min window rather than a single instant.
#
- platform: statistics
  name: "System CPU Usage Average Internal"
  unique_id: system_cpu_usage_average_internal
  entity_id: sensor.system_monitor_processor_use
  state_characteristic: mean
  max_age:
    minutes: 5

- platform: statistics
  name: "OPNsense CPU Usage Average Internal"
  unique_id: opnsense_cpu_usage_average_internal
  entity_id: sensor.opnsense_shencentral_net_cpu_usage
  state_characteristic: mean
  max_age:
    minutes: 5

- platform: statistics
  name: "OPNsense CPU 0 Temp Average Internal"
  unique_id: opnsense_cpu_0_temp_average_internal
  entity_id: sensor.opnsense_shencentral_net_temp_cpu_0
  state_characteristic: mean
  max_age:
    minutes: 5
  precision: 1

- platform: statistics
  name: "OPNsense CPU 1 Temp Average Internal"
  unique_id: opnsense_cpu_1_temp_average_internal
  entity_id: sensor.opnsense_shencentral_net_temp_cpu_1
  state_characteristic: mean
  max_age:
    minutes: 5
  precision: 1

- platform: statistics
  name: "OPNsense CPU 2 Temp Average Internal"
  unique_id: opnsense_cpu_2_temp_average_internal
  entity_id: sensor.opnsense_shencentral_net_temp_cpu_2
  state_characteristic: mean
  max_age:
    minutes: 5
  precision: 1

- platform: statistics
  name: "OPNsense CPU 3 Temp Average Internal"
  unique_id: opnsense_cpu_3_temp_average_internal
  entity_id: sensor.opnsense_shencentral_net_temp_cpu_3
  state_characteristic: mean
  max_age:
    minutes: 5
  precision: 1

- platform: filter
  name: "Filtered Living Rm Visible Light"
  unique_id: filtered_living_rm_visible_light
  entity_id: sensor.raw_living_rm_visible_light # sensor is set to update every minute
  filters:
    - filter: outlier
      radius: 5 # default radius is 2 if unspecified
      window_size: 5 # num of prev states to define median (default = 1)
    - filter: lowpass
      time_constant: 5 # Loosely relates to the amount of time it takes for a state to influence the output
      precision: 0

- platform: filter
  name: "Filtered KFLWILDW56 BU Local Rad Lx"
  unique_id: filtered_kflwildw56_bu_local_rad_lx
  entity_id: sensor.kflwildw56_backed_up_local_solar_rad_lx # sensor provides mean value every minute
  filters:
    - filter: outlier
      radius: 1000 # default radius is 2 if unspecified
      window_size: 10 # num of prev states to define median (default = 1)
    - filter: lowpass
      time_constant: 10 # Loosely relates to the amount of time it takes for a state to influence the output
      precision: 0

#
# MQTT_ROOM- room of device/beacon location
#            Add one entry for each device tracked
#
- platform: mqtt_room
  device_id: !secret ys_UUID_device_id
  name: "YS cell BLE room"
  state_topic: !secret ys_UUID_state_topic
  timeout: 60
  away_timeout: 120

- platform: mqtt_room
  device_id: !secret kt_UUID_device_id
  name: "KT cell BLE room"
  state_topic: !secret kt_UUID_state_topic
  timeout: 60
  away_timeout: 120

#
# SNMP sensors
#
- platform: snmp
  unique_id: junior_temperature
  name: "junior temperature"
  device_class: temperature
  host: junior.shencentral.net
  baseoid: 1.3.6.1.4.1.6574.1.2.0
  scan_interval: 3600
  accept_errors: true
  unit_of_measurement: "°C"

- platform: snmp
  unique_id: junior_system_fan_status
  name: "junior system fan status"
  host: junior.shencentral.net
  baseoid: 1.3.6.1.4.1.6574.1.4.1.0
  scan_interval: 3600
  accept_errors: true
  value_template: >
    {% if value | int(default=0) == 1 %}
    OK
    {% else %}
    FAULT
    {% endif %}

- platform: snmp
  unique_id: junior_cpu_fan_status
  name: "junior CPU fan status"
