#
# Time & Date
#
- platform: time_date
  display_options:
    - "time"
    - "date"
    - "date_time"
    - "time_date"
    - "time_utc"
    #- 'beat'

#
#  RESTful sensors
#
- platform: rest
  resource: !secret ip_geo_location_secret
  name: ip_geo_location
  scan_interval: 300
  value_template: "OK"
  json_attributes:
    - moonrise
    - moonset
    - moon_altitude
