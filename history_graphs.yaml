##  Note: leading spaces in each line are critical
##  to yaml interpretation - do not delete them

### HISTORY_GRAPHS ###

gr1:
  name: "Outdoor Luminosity"
  hours_to_show: 24
  refresh: 300
  entities:
    - sensor.kflwildw56_backed_up_local_solar_rad_lx
    - sensor.filtered_kflwildw56_bu_local_rad_lx

gr2:
  name: "Indoor Luminosity"
  hours_to_show: 24
  refresh: 300
  entities:
    - sensor.filtered_living_rm_visible_light
    - sensor.raw_living_rm_visible_light

gr3:
  name: "Temperature"
  hours_to_show: 24
  refresh: 300
  entities:
    - sensor.kflwildw56_aws_temp
    - sensor.local_ecobee_current_temperature
    - sensor.actual_sunroom_temperature
    - sensor.attic_temperature
    - sensor.garage_controller_temperature
    - sensor.upper_rack_temperature_f
    - sensor.mid_rack_temperature_f

gr4:
  name: "Humidity"
  hours_to_show: 24
  refresh: 300
  entities:
    - sensor.kflwildw56_aws_humidity
    - sensor.local_ecobee_current_humidity
    - sensor.sunroom_ac_sunroom_ac_indoor_humidity
    #  - sensor.attic_humidity
    - sensor.upper_rack_humidity
    - sensor.mid_rack_humidity
    - sensor.drybox_relative_humidity

gr5:
  name: "Activity"
  hours_to_show: 24
  refresh: 60
  entities:
    - lock.front_door_lock
    - lock.back_door_lock
    - cover.large_garage_door
    - cover.small_garage_door
    - binary_sensor.living_area_motion
    - binary_sensor.front_door_window_door_is_open
    - binary_sensor.garagehouse_door_window_door_is_open
    - binary_sensor.back_door_window_door_is_open

gr6:
  name: "Location"
  hours_to_show: 24
  refresh: 60
  entities:
    - person.karen
    - device_tracker.kt_cell_gps
    - person.yang
    - device_tracker.ys_cell_gps

gr7:
  name: "Proximity to Home"
  hours_to_show: 24
  refresh: 60
  entities:
    - sensor.home_ys_cell_gps_distance
    - sensor.home_kt_cell_gps_distance

gr8:
  name: "Announcements"
  hours_to_show: 24
  refresh: 60
  entities:
    - media_player.greatroom_speakers
    - media_player.office_speakers

gr9:
  name: "Switches"
  hours_to_show: 24
  refresh: 120
  entities:
    - switch.lg_garage_opener_power
    - switch.sm_garage_opener_power
    - switch.candles

gr10:
  name: "Lights & Fans"
  hours_to_show: 24
  refresh: 120
  entities:
    - switch.front_door_lights
    - switch.back_door_lights
    - light.kitchen_cabinet_lights
    - light.eating_area_lights
    - light.guest_room_lights
    - light.island_lights
    - light.living_room_lights
    - light.master_bedroom_lights
    - light.office_lights
    - light.sun_room_lights
    - light.track_lights
    - fan.guest_room_fan
    - fan.sun_room_fan_1
    - fan.sun_room_fan_2
    - fan.living_room_fan
    - fan.master_bedroom_fan
    - fan.office_fan
