#################################################
##                                             ##
## recorder.yaml - what to put in the database ##
## if you care about:                          ##
##     - states between reboots                ##
##     - history data                          ##
##                                             ##
##  Raw state history is kept for              ##
##  purge_keep_days. Long-term numeric trends  ##
##  (temp/humidity/pressure/etc) survive       ##
##  indefinitely via HA long-term statistics   ##
##  instead (requires state_class on the       ##
##  entity - see customize.yaml).              ##
##                                             ##
#################################################

db_url: !secret mariadb_url

auto_purge: true
auto_repack: true
purge_keep_days: 30 # how many days of raw history to keep

include:
  domains:
    - automation # keep automations for debugging using Logbook
    - binary_sensor
    #    - button
    #    - camera
    #    - climate
    #    - cover
    #    - device_tracker
    - input_boolean
    - input_datetime
    - input_number
    - input_select
    - input_text
    #    - light
    #    - lock
    #    - media_player
    #    - number
    - person
    - proximity
    #    - select
    - sensor
    #    - scene
    #    - script
    #    - switch
    #    - update
    #    - zone
  entity_globs:
    - device_tracker.ys_*
    - device_tracker.kt_*
    - sensor.irrig_*
    # monitored mesh nodes only - see exclude.entity_globs below
    - sensor.meshtastic_ys0_1218617136_* # ...9f30
    - sensor.meshtastic_ys0_1594801232_* # ...bc50
    - sensor.meshtastic_ys0_2610934133_* # ...b175
    - sensor.meshtastic_ys0_2997308732_* # ...4d3c (base node)
  entities:
    - device_tracker.opnsense_ys_cell_shencentral_net
    - device_tracker.opnsense_kt_cell_shencentral_net

exclude:
  domains:
    - group
  entity_globs:
    - sensor.ys_desktop_*
    - sensor.*_battery*
    - sensor.esp01_*
    - sensor.hot_*
    - sensor.openweathermap_*
    - sensor.weather_*
    - binary_sensor.*_battery*
    - binary_sensor.esp01_*
    - binary_sensor.hot_*
    # no long-term stats for mesh nodes except the ones included above
    - sensor.meshtastic_ys0_*
  entities:
    - automation.awtrix_mega_weather
    - sensor.date
    - sensor.time
    - sensor.date_time
    - sensor.time_date
    - sun.sun
    # raw sources now sampled every 5 min via sensors.yaml/templates.yaml - see
    # sensor.*_5min_average for the entities that actually get recorded
    - sensor.system_monitor_processor_use
    - sensor.opnsense_shencentral_net_cpu_usage
    - sensor.opnsense_shencentral_net_temp_cpu_0
    - sensor.opnsense_shencentral_net_temp_cpu_1
    - sensor.opnsense_shencentral_net_temp_cpu_2
    - sensor.opnsense_shencentral_net_temp_cpu_3
    # internal statistics helpers - update every source tick, only their 5-min
    # sampled counterparts (sensor.*_5min_average) need to be recorded
    - sensor.system_cpu_usage_average_internal
    - sensor.opnsense_cpu_usage_average_internal
    - sensor.opnsense_cpu_0_temp_average_internal
    - sensor.opnsense_cpu_1_temp_average_internal
    - sensor.opnsense_cpu_2_temp_average_internal
    - sensor.opnsense_cpu_3_temp_average_internal
